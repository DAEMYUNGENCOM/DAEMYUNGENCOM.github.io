<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAE MYUNG ENCOM | TILE</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css">

  <style>
    :root{
      --bg:#f9fafb;
      --white:#fff;
      --text-main:#111;
      --text-sub:#555;
      --text-muted:#888;
      --line:#e5e7eb;
      --hairline:rgba(17,17,17,.10);
      --ease:cubic-bezier(0.22,1,0.36,1);
    }

    body{
      margin:0;
      padding-top:70px;
      font-family:'Pretendard', -apple-system, BlinkMacSystemFont,
               'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif;
      background:var(--bg);
      color:var(--text-main);
    }
    a{ color:inherit; }

    /* NAV (index와 통일) */
    nav{
      position:fixed;
      top:0;
      width:100%;
      height:70px;
      background:var(--white);
      border-bottom:1px solid var(--line);
      z-index:1000;
    }
    .nav-inner{
      max-width:1200px;
      height:100%;
      margin:0 auto;
      padding:0 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .nav-inner img{ display:block; }
    .menu a{
      margin-left:30px;
      text-decoration:none;
      color:var(--text-main);
      font-weight:500;
      letter-spacing:.08em;
    }

    /* PAGE HEADER */
    .page-hero{
      background:var(--white);
      border-bottom:1px solid var(--line);
      padding:56px 20px 48px;
    }
    .page-hero .wrap{
      max-width:1200px;
      margin:0 auto;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:24px;
    }
    .page-title{
      margin:0;
      font-size:34px;
      letter-spacing:.14em;
    }
    .page-kicker{
      margin:10px 0 0;
      font-size:12px;
      letter-spacing:.22em;
      color:var(--text-muted);
    }
    .page-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:38px;
      padding:0 14px;
      font-size:12px;
      letter-spacing:.14em;
      text-decoration:none;
      color:var(--text-main);
      border:1px solid rgba(17,17,17,.16);
      background:transparent;
      transition:transform .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
    }
    .btn:hover{
      transform:translateY(-1px);
      border-color:rgba(17,17,17,.28);
      background:rgba(17,17,17,.03);
    }

    /* SECTION */
    .section{ padding:70px 20px 110px; }
    .wrap{ max-width:1200px; margin:0 auto; }

    /* GRID */
    .grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:28px;
    }

    /* CARD */
    .card{
      background:#fff;
      border:1px solid var(--line);
      transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
      overflow:hidden;
    }
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 38px rgba(17,17,17,.08);
      border-color:rgba(17,17,17,.14);
    }

    .media{
      position:relative;
      aspect-ratio:1/1;
      background:#f3f4f6;
    }
    .media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    /* 크게보기 UX */
    .media img.zoomable{
      cursor: zoom-in;
      user-select:none;
      -webkit-user-drag:none;
    }

    .badge{
      position:absolute;
      left:12px;
      top:12px;
      padding:6px 10px;
      font-size:11px;
      letter-spacing:.18em;
      background:rgba(17,17,17,.70);
      color:#fff;
    }

    /* thumb switch */
    .thumbs{
      position:absolute;
      left:12px;
      bottom:12px;
      display:flex;
      gap:8px;
      z-index:2;
    }
    .thumb-btn{
      width:34px;
      height:34px;
      border:1px solid rgba(255,255,255,.55);
      background:rgba(0,0,0,.18);
      backdrop-filter:blur(6px);
      cursor:pointer;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
    }
    .thumb-btn:hover{ transform:translateY(-1px); }
    .thumb-btn.active{
      background:rgba(0,0,0,.32);
      border-color:rgba(255,255,255,.75);
    }
    .thumb-btn span{
      font-size:11px;
      letter-spacing:.14em;
      color:#fff;
      opacity:.95;
    }

    .info{ padding:16px 16px 18px; }
    .name{
      margin:0 0 10px;
      font-size:14px;
      letter-spacing:.10em;
    }
    .spec{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      gap:7px;
      font-size:13px;
      line-height:1.6;
      color:var(--text-sub);
    }
    .spec span{
      display:inline-block;
      width:74px;
      color:var(--text-muted);
      letter-spacing:.06em;
    }

    .note{
      margin:14px 0 0;
      font-size:12px;
      color:var(--text-muted);
      line-height:1.7;
    }

    /* ===== Image Lightbox ===== */
    .lightbox{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
    }
    .lightbox.show{ display:flex; }
    .lightbox-inner{
      position: relative;
      max-width: min(1200px, 96vw);
      max-height: 92vh;
    }
    .lightbox-img{
      display:block;
      max-width: 100%;
      max-height: 92vh;
      width: auto;
      height: auto;
      border-radius: 12px;
    }
    .lightbox-close{
      position:absolute;
      top:-12px;
      right:-12px;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.35);
      color:#fff;
      cursor:pointer;
      font-size:18px;
      line-height: 1;
    }
    .lightbox-close:hover{
      background: rgba(0,0,0,.55);
    }

    /* responsive */
    @media(max-width:980px){
      .grid{ grid-template-columns:repeat(2, 1fr); }
      .page-hero .wrap{ flex-direction:column; align-items:flex-start; }
    }
    @media(max-width:640px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html">
        <img src="대명엔컴-영문로고 (워터마크).png" height="28" alt="DAE MYUNG ENCOM">
      </a>
      <div class="menu">
        <a href="company.html">COMPANY</a>
        <a href="index.html#products">PRODUCT</a>
        <a href="index.html#contact">CONTACT</a>
      </div>
    </div>
  </nav>

  <header class="page-hero">
    <div class="wrap">
      <div>
        <h1 class="page-title">TILE</h1>
        <p class="page-kicker">DAE MYUNG ENCOM · TILE COLLECTION</p>
      </div>
      <div class="page-actions">
        <a class="btn" href="index.html#products">메인으로</a>
        <a class="btn" href="index.html#contact">문의하기</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="wrap">
      <div class="grid">

        <!-- ✅ PRODUCT CARD 1개 (SABIA LIGHT GREY) -->
        <article class="card" data-product="sabia-300">
          <div class="media">
            <span class="badge">TILE</span>

            <!-- ✅ class 속성 1개로 합침: main-img + zoomable -->
            <img class="main-img zoomable"
                 src="product/tile/300_SABIALIGHTGREY.jpg"
                 alt="SABIA LIGHT GREY">

            <!-- 썸/제품/패턴 전환 버튼 -->
            <div class="thumbs" role="tablist" aria-label="Image switch">
              <button type="button" class="thumb-btn active" data-src="product/tile/300_SABIALIGHTGREY.jpg" aria-label="썸네일">
                <span>TH</span>
              </button>
              <button type="button" class="thumb-btn" data-src="product/tile/300한장_SABIALIGHTGREY.jpg" aria-label="제품 이미지">
                <span>PR</span>
              </button>
              <button type="button" class="thumb-btn" data-src="product/tile/300패턴도_SABIALIGHTGREY.jpg" aria-label="패턴도">
                <span>PT</span>
              </button>
            </div>
          </div>

          <div class="info">
            <h3 class="name">SABIA LIGHT GREY</h3>
            <ul class="spec">
              <li><span>규격</span> 300×300</li>
              <li><span>표면</span> 무광</li>
              <li><span>Pcs/Box</span> 16pcs</li>
            </ul>
            <p class="note">※ 썸네일(TH) / 제품(PR) / 패턴(PT) 버튼으로 이미지를 전환해 확인할 수 있습니다.</p>
          </div>
        </article>

      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-inner" role="dialog" aria-modal="true">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="닫기">×</button>
      <img class="lightbox-img" id="lightboxImg" src="" alt="">
    </div>
  </div>

  <script>
    // 카드 내부 이미지 전환 (상세페이지 없이)
    document.querySelectorAll('.card').forEach(card=>{
      const img = card.querySelector('.main-img');
      const buttons = card.querySelectorAll('.thumb-btn');
      if(!img || !buttons.length) return;

      buttons.forEach(btn=>{
        btn.addEventListener('click', ()=>{
          buttons.forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');

          const src = btn.dataset.src;
          if(src) img.src = src;
        });
      });
    });

    // Lightbox
    (function(){
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxClose = document.getElementById('lightboxClose');
      if(!lightbox || !lightboxImg || !lightboxClose) return;

      function openLightbox(src, alt){
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.classList.add('show');
        lightbox.setAttribute('aria-hidden','false');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox(){
        lightbox.classList.remove('show');
        lightbox.setAttribute('aria-hidden','true');
        lightboxImg.src = '';
        document.body.style.overflow = '';
      }

      document.addEventListener('click', (e)=>{
        const img = e.target.closest('img.zoomable');
        if(!img) return;
        openLightbox(img.currentSrc || img.src, img.alt);
      });

      lightboxClose.addEventListener('click', closeLightbox);

      lightbox.addEventListener('click', (e)=>{
        if(e.target === lightbox) closeLightbox();
      });

      window.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape' && lightbox.classList.contains('show')){
          closeLightbox();
        }
      });
    })();
  </script>
</body>
</html>
