<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAE MYUNG ENCOM | SANITARY</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css">

  <style>
    :root{
      --bg:#f9fafb;
      --white:#fff;
      --text-main:#111;
      --text-sub:#555;
      --text-muted:#888;
      --line:#e5e7eb;
      --hairline:rgba(17,17,17,.10);
      --ease:cubic-bezier(0.22,1,0.36,1);
    }

    body{
      margin:0;
      padding-top:70px;
      font-family:'Pretendard', -apple-system, BlinkMacSystemFont,
               'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif;
      background:var(--bg);
      color:var(--text-main);
    }
    a{ color:inherit; }

    /* NAV */
    nav{
      position:fixed;
      top:0;
      width:100%;
      height:70px;
      background:var(--white);
      border-bottom:1px solid var(--line);
      z-index:1000;
    }
    .nav-inner{
      max-width:1200px;
      height:100%;
      margin:0 auto;
      padding:0 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .nav-inner img{ display:block; }
    .menu a{
      margin-left:30px;
      text-decoration:none;
      color:var(--text-main);
      font-weight:500;
      letter-spacing:.08em;
    }

    /* PAGE HEADER */
    .page-hero{
      background:var(--white);
      border-bottom:1px solid var(--line);
      padding:56px 20px 48px;
    }
    .page-hero .wrap{
      max-width:1200px;
      margin:0 auto;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:24px;
    }
    .page-title{
      margin:0;
      font-size:34px;
      letter-spacing:.14em;
    }
    .page-kicker{
      margin:10px 0 0;
      font-size:12px;
      letter-spacing:.22em;
      color:var(--text-muted);
    }
    .page-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:38px;
      padding:0 14px;
      font-size:12px;
      letter-spacing:.14em;
      text-decoration:none;
      color:var(--text-main);
      border:1px solid rgba(17,17,17,.16);
      background:transparent;
      transition:transform .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
    }
    .btn:hover{
      transform:translateY(-1px);
      border-color:rgba(17,17,17,.28);
      background:rgba(17,17,17,.03);
    }

    /* SECTION */
    .section{ padding:70px 20px 110px; }
    .wrap{ max-width:1200px; margin:0 auto; }

    /* (선택) 카테고리 필터 자리 - 다음 단계에서 JS로 필터링 가능 */
    .category-bar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:0 0 22px;
    }
    .cat-btn{
      height:36px;
      padding:0 14px;
      border:1px solid rgba(17,17,17,.16);
      background:#fff;
      cursor:pointer;
      font-size:12px;
      letter-spacing:.12em;
      transition:transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
    }
    .cat-btn:hover{
      transform:translateY(-1px);
      border-color:rgba(17,17,17,.28);
      background:rgba(17,17,17,.03);
    }
    .cat-btn.active{
      border-color:rgba(17,17,17,.38);
      background:rgba(17,17,17,.06);
    }

    /* GRID */
    .grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:28px;
    }

    /* ============ SANITARY CARD ============ */
    .s-card{
      background:#fff;
      border:1px solid rgba(17,17,17,.10);
      overflow:hidden;
      cursor:pointer;
      transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease);
    }
    .s-card:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 38px rgba(17,17,17,.08);
      border-color:rgba(17,17,17,.16);
    }
    .s-thumb{
      position:relative;
      aspect-ratio:1/1;
      background:#f3f4f6;
    }
    .s-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }
    .s-mini{ padding:14px 16px 16px; }
    .s-name{ margin:0 0 8px; font-size:14px; letter-spacing:.08em; }
    .s-sub{ margin:0; font-size:13px; color:#555; }

    .page-disclaimer{
      margin: 22px 2px 0;
      font-size:12px;
      line-height:1.7;
      color:var(--text-muted);
    }

    /* ============ MODAL ============ */
    .s-modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.72);
      display:none;
      align-items:center;
      justify-content:center;
      padding:22px;
      z-index:9999;
    }
    .s-modal.show{ display:flex; }

    .s-modal-panel{
      width:min(1100px, 96vw);
      height:min(680px, 92vh); /* ✅ 높이 고정: 이미지 종류 바뀌어도 레이아웃 흔들림 최소 */
      background:#fff;
      border-radius:18px;
      overflow:hidden;
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      position:relative;
    }

    .s-close{
      position:absolute;
      top:14px; right:14px;
      width:38px; height:38px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.12);
      background:#fff;
      cursor:pointer;
      font-size:18px; line-height:1;
      z-index:10;
      transition:transform .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
    }
    .s-close:hover{
      transform:translateY(-1px);
      border-color:rgba(0,0,0,.22);
      background:rgba(0,0,0,.02);
    }

    /* LEFT */
    .s-left{ background:#0b0b0b; }
    .s-stage{ position:relative; width:100%; height:100%; }
    .s-modal-img{
      width:100%; height:100%;
      object-fit:contain;
      background:#111;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* Icon tabs */
    .s-tabs{
      position:absolute;
      left:16px;
      bottom:16px;
      display:flex;
      gap:10px;
      z-index:5;
    }
    .s-ico{ width:18px; height:18px; display:block; }

    .s-tab{
      width:42px; height:42px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.26);
      background:rgba(0,0,0,.28);
      color:rgba(255,255,255,.92);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:transform .2s var(--ease), background .2s, border-color .2s;
    }
    .s-tab:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.40);
      background:rgba(0,0,0,.38);
    }
    .s-tab.active{
      background:rgba(255,255,255,.16);
      border-color:rgba(255,255,255,.58);
      color:#fff;
    }

    /* RIGHT */
    .s-right{
      padding:26px 26px 20px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      justify-content:center; /* ✅ 가운데 정렬 느낌 */
    }
    .s-title{
      margin:0 0 8px;
      font-size:22px;
      letter-spacing:.08em;
    }
    .s-subtitle{
      margin:0 0 16px;
      font-size:13px;
      color:#666;
      letter-spacing:.04em;
    }

    /* Features bullet UI */
    .s-features{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px 14px;
      font-size:13px;
      color:#222;
    }
    .s-features li{
      display:flex;
      gap:8px;
      align-items:flex-start;
    }
    .s-features li::before{
      content:"";
      width:6px; height:6px;
      border-radius:999px;
      background:#111;
      margin-top:6px;
      opacity:.75;
      flex:0 0 auto;
    }

    .s-divider{
      height:1px;
      background:rgba(17,17,17,.10);
      margin:18px 0 14px;
    }

    /* Spec list (dl) */
    .s-spec{
      display:grid;
      grid-template-columns: 86px 1fr;
      gap:10px 12px;
      font-size:13px;
      line-height:1.7;
      color:#333;
      margin:0;
    }
    .s-spec dt{
      color:#777;
      letter-spacing:.06em;
    }
    .s-spec dd{
      margin:0;
      word-break:keep-all;
    }

    .s-disclaimer{
      margin:16px 0 0;
      font-size:12px;
      line-height:1.7;
      color:#888;
    }

    /* responsive */
    @media(max-width:980px){
      .grid{ grid-template-columns:repeat(2, 1fr); }
      .page-hero .wrap{ flex-direction:column; align-items:flex-start; }
      .s-modal-panel{ grid-template-columns:1fr; height:min(760px, 92vh); }
      .s-right{ justify-content:flex-start; }
      .s-features{ grid-template-columns:1fr; }
    }
    @media(max-width:640px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <a href="index.html">
        <img src="대명엔컴-영문로고 (워터마크).png" height="28" alt="DAE MYUNG ENCOM">
      </a>
      <div class="menu">
        <a href="company.html">COMPANY</a>
        <a href="index.html#products">PRODUCT</a>
        <a href="index.html#contact">CONTACT</a>
      </div>
    </div>
  </nav>

  <!-- PAGE HERO -->
  <header class="page-hero">
    <div class="wrap">
      <div>
        <h1 class="page-title">SANITARY</h1>
        <p class="page-kicker">DAE MYUNG ENCOM · SANITARY COLLECTION</p>
      </div>
      <div class="page-actions">
        <a class="btn" href="index.html#products">메인으로</a>
        <a class="btn" href="index.html#contact">문의하기</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="wrap">

      <!-- (선택) 카테고리 버튼: 지금은 UI만, 다음 단계에서 필터 기능 붙이면 됨 -->
      <div class="category-bar" aria-label="Sanitary category filter">
        <button type="button" class="cat-btn active" data-cat="all">ALL</button>
        <button type="button" class="cat-btn" data-cat="양변기벽배수형">양변기 · 벽배수형</button>
        <button type="button" class="cat-btn" data-cat="양변기원피스형">양변기 · 원피스형</button>
        <button type="button" class="cat-btn" data-cat="양변기투피스형">양변기 · 투피스형</button>
        <button type="button" class="cat-btn" data-cat="양변기플러쉬밸브형">양변기 · 플러쉬밸브형</button>
        <!-- 필요하면 더 추가 -->
      </div>

      <!-- GRID -->
      <div class="grid">

        <!-- =========================
             [샘플 제품] DST-830P/831P
             ✅ 앞으로 제품 추가는 이 블록을 "복사/붙여넣기" 하면서 data-*만 바꾸면 됨
             ========================= -->
        <article class="s-card"
          data-category="양변기벽배수형"
          data-name="DST-830P / 831P"
          data-sub="벽배수형, 바닥안착형"

          data-img="product/sanitary/양변기벽배수형/DST-830P,831P.jpg"
          data-dwg="product/sanitary/양변기벽배수형/DST-830P_do_1.jpg"

          data-features="자동물내림|벽배수|일체형비데|직수압식"

          data-model="자동개폐 DST-830 / 수동개폐 DST-831 / CC-830P"
          data-size="725×400×555"
          data-capacity="평균사용수량 4L"
          data-note="※ 비데결합 품번이 SMARTLET 830P로, 환경표지인증을 취득한 제품은 대변기 CC-830P 입니다."
          aria-label="DST-830P / 831P 상세 보기">

          <div class="s-thumb">
            <img src="product/sanitary/양변기벽배수형/DST-830P,831P.jpg" alt="DST-830P / 831P 제품 이미지">
          </div>

          <div class="s-mini">
            <h3 class="s-name">DST-830P / 831P</h3>
            <p class="s-sub">벽배수형, 바닥안착형</p>
          </div>
        </article>

        <!-- ✅ 다음 제품은 여기에 추가 -->

      </div>

      <p class="page-disclaimer">
        * 상품 이미지는 실제 제품과 차이가 있을 수 있으며, 제조사 사정에 따라 디자인 모양이나 색상이 다를 수 있습니다.
      </p>

    </div>
  </main>

  <!-- =========================
       MODAL (페이지에 1번만)
       ========================= -->
  <div class="s-modal" id="sModal" aria-hidden="true">
    <div class="s-modal-panel" role="dialog" aria-modal="true" aria-label="SANITARY 제품 상세">
      <button class="s-close" id="sModalClose" type="button" aria-label="닫기">×</button>

      <!-- LEFT: 이미지 -->
      <div class="s-left">
        <div class="s-stage">
          <img class="s-modal-img" id="sModalImg" src="" alt="">

          <div class="s-tabs" role="tablist" aria-label="이미지 전환">
            <button class="s-tab active" type="button" data-kind="img" aria-label="제품 사진">
              <svg viewBox="0 0 24 24" class="s-ico" aria-hidden="true">
                <path d="M4 6h16v12H4z" fill="none" stroke="currentColor" stroke-width="1.6"/>
                <path d="M7 14l3-3 3 3 2-2 2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 9.2h.01" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </button>

            <button class="s-tab" type="button" data-kind="dwg" aria-label="도면">
              <svg viewBox="0 0 24 24" class="s-ico" aria-hidden="true">
                <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- RIGHT: 텍스트/스펙 -->
      <aside class="s-right">
        <h3 class="s-title" id="sTitle">-</h3>
        <p class="s-subtitle" id="sSubtitle">-</p>

        <ul class="s-features" id="sFeatures"></ul>

        <div class="s-divider"></div>

        <dl class="s-spec" id="sSpec"></dl>

        <p class="s-disclaimer">
          * 상품 이미지는 실제 제품과 차이가 있을 수 있으며, 제조사 사정에 따라 디자인 모양이나 색상이 다를 수 있습니다.
        </p>
      </aside>
    </div>
  </div>

  <script>
  (function(){
    /* =====================
       우클릭 / 이미지 드래그 방지
       ===================== */
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => {
      if (e.target && e.target.tagName === 'IMG') e.preventDefault();
    });

    const modal = document.getElementById('sModal');
    const closeBtn = document.getElementById('sModalClose');
    const modalImg = document.getElementById('sModalImg');

    const titleEl = document.getElementById('sTitle');
    const subEl = document.getElementById('sSubtitle');
    const featuresEl = document.getElementById('sFeatures');
    const specEl = document.getElementById('sSpec');

    const tabs = Array.from(document.querySelectorAll('.s-tab'));

    let current = { img:'', dwg:'' };
    let currentKind = 'img';

    function setActiveTab(kind){
      tabs.forEach(t => t.classList.toggle('active', t.dataset.kind === kind));
    }

    function show(kind){
      const src = current[kind];
      if(!src) return;
      currentKind = kind;
      modalImg.src = src;
      modalImg.alt = `${titleEl.textContent} ${kind === 'img' ? '제품 이미지' : '도면'}`;
      setActiveTab(kind);
    }

    function openModalFromCard(card){
      // 제목/부제
      titleEl.textContent = card.dataset.name || '-';
      subEl.textContent = card.dataset.sub || '';

      // 이미지
      current = {
        img: card.dataset.img || '',
        dwg: card.dataset.dwg || ''
      };

      // 특징 불릿: "A|B|C"
      featuresEl.innerHTML = '';
      const feats = (card.dataset.features || '')
        .split('|')
        .map(s => s.trim())
        .filter(Boolean);

      feats.forEach(f => {
        const li = document.createElement('li');
        li.textContent = f;
        featuresEl.appendChild(li);
      });

      // 추가정보: dt/dd 자동 생성 (빈 값은 자동 제외)
      const items = [
        ['품번', card.dataset.model],
        ['사이즈', card.dataset.size],
        ['용량', card.dataset.capacity],
        ['비고', card.dataset.note],
      ].filter(([,v]) => v && v.trim().length);

      specEl.innerHTML = '';
      items.forEach(([k,v])=>{
        const dt = document.createElement('dt'); dt.textContent = k;
        const dd = document.createElement('dd'); dd.textContent = v;
        specEl.appendChild(dt);
        specEl.appendChild(dd);
      });

      // 기본은 제품 이미지
      show('img');

      // 오픈
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      modalImg.src = '';
      document.body.style.overflow = '';
    }

    // 카드 클릭 → 모달
    document.querySelectorAll('.s-card').forEach(card=>{
      card.addEventListener('click', ()=> openModalFromCard(card));
    });

    // 탭 클릭
    tabs.forEach(tab=>{
      tab.addEventListener('click', ()=> show(tab.dataset.kind));
    });

    // 닫기
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });

    // ESC 닫기
    window.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && modal.classList.contains('show')) closeModal();
    });

    /* =====================
       (선택) 카테고리 필터
       - 지금은 버튼 UI가 있으니 기능도 같이 넣어둠
       - 제품 추가할 때 data-category 값만 맞추면 됨
       ===================== */
    (function(){
      const btns = document.querySelectorAll('.cat-btn');
      const cards = document.querySelectorAll('.s-card');
      if(!btns.length || !cards.length) return;

      function apply(cat){
        cards.forEach(card=>{
          const c = card.dataset.category || '';
          const show = (cat === 'all') || (c === cat);
          card.style.display = show ? '' : 'none';
        });
      }

      btns.forEach(b=>{
        b.addEventListener('click', ()=>{
          btns.forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          apply(b.dataset.cat);
        });
      });

      apply('all');
    })();
  })();
  </script>
</body>
</html>
